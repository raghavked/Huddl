<!-- Supabase Auth template: Confirm signup.
     Paste into Dashboard -> Authentication -> Emails -> Confirm signup.
     Variables like {{ .ConfirmationURL }} are filled in by Supabase.
     Table layout and inline styles on purpose: email clients ignore
     stylesheets, and Outlook still lays out with tables. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#faf6ee;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background-color:#fffcf5;border:1px solid #e6dcc8;border-radius:16px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
          <td style="font-size:26px;font-weight:800;color:#b5502f;letter-spacing:-0.5px;padding-bottom:20px;">
            hearth
          </td>
        </tr>
        <tr>
          <td style="font-size:20px;font-weight:700;color:#2b2118;padding-bottom:10px;">
            Confirm your school email
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:22px;color:#6b5d4f;padding-bottom:24px;">
            This address is how Hearth knows you're a student. One tap and
            you're in with your campus.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#b5502f;color:#fffcf5;font-size:15px;font-weight:700;text-decoration:none;padding:13px 28px;border-radius:999px;">
              Confirm my email
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:19px;color:#6b5d4f;border-top:1px solid #e6dcc8;padding-top:20px;">
            The link works once and expires after 24 hours. If you didn't
            sign up for Hearth, ignore this and nothing happens.
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;">
        <tr>
          <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#6b5d4f;padding:20px 8px 0;text-align:center;">
            Hearth &middot; Your campus, gathered. &middot;
            <a href="https://uhearth.app/legal/privacy" style="color:#6b5d4f;">Privacy</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
